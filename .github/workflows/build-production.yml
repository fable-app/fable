name: Production Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Production
    runs-on: ubuntu-latest
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps

      - name: Build Android production
        id: build
        working-directory: apps/mobile
        run: |
          BUILD_OUTPUT=$(eas build --platform android --profile production --non-interactive --json)
          echo "$BUILD_OUTPUT" > eas-build-result.json
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.[0].id')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::Failed to get Android build ID from EAS"
            echo "$BUILD_OUTPUT"
            exit 1
          fi
          echo "build-id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"

      - name: Upload build artifact info
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-build-info
          path: apps/mobile/eas-build-result.json
          retention-days: 30

  submit-android:
    name: Submit to Google Play Store
    runs-on: ubuntu-latest
    needs: build-android
    if: needs.build-android.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps

      - name: Create service account key file
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_KEY secret is not configured. See .github/workflows/PLAY_STORE_SETUP.md"
            exit 1
          fi
          mkdir -p secrets
          printf '%s\n' "$GOOGLE_SERVICE_ACCOUNT_KEY" > secrets/play-store-credentials.json
          jq -e '.type == "service_account"' secrets/play-store-credentials.json > /dev/null

      - name: Submit to Google Play Store
        working-directory: apps/mobile
        run: |
          eas submit --platform android --id ${{ needs.build-android.outputs.build-id }} --non-interactive

      - name: Clean up credentials
        if: always()
        working-directory: apps/mobile
        run: rm -rf secrets/

  build-ios:
    name: Build iOS Production
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps

      - name: Configure App Store Connect API key
        working-directory: apps/mobile
        env:
          APPLE_APP_STORE_CONNECT_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          if [ -n "$APPLE_APP_STORE_CONNECT_KEY" ] && [ -n "$APPLE_KEY_ID" ] && [ -n "$APPLE_ISSUER_ID" ]; then
            mkdir -p secrets
            printf '%s\n' "$APPLE_APP_STORE_CONNECT_KEY" > secrets/asc-api-key.p8
            echo "EXPO_ASC_API_KEY_PATH=${{ github.workspace }}/apps/mobile/secrets/asc-api-key.p8" >> $GITHUB_ENV
            echo "EXPO_ASC_KEY_ID=$APPLE_KEY_ID" >> $GITHUB_ENV
            echo "EXPO_ASC_ISSUER_ID=$APPLE_ISSUER_ID" >> $GITHUB_ENV
          else
            echo "::warning::Apple ASC API key secrets not configured. iOS non-interactive builds require credentials pre-configured in EAS. Run 'eas build --platform ios --profile production' locally once, or add APPLE_APP_STORE_CONNECT_KEY, APPLE_KEY_ID, and APPLE_ISSUER_ID secrets."
          fi

      - name: Build iOS production
        id: build
        working-directory: apps/mobile
        run: |
          BUILD_OUTPUT=$(eas build --platform ios --profile production --non-interactive --json)
          echo "$BUILD_OUTPUT" > eas-build-result.json
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.[0].id')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::Failed to get iOS build ID from EAS. Ensure iOS credentials are configured (run an interactive local build first)."
            echo "$BUILD_OUTPUT"
            exit 1
          fi
          echo "build-id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"

      - name: Upload build artifact info
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-build-info
          path: apps/mobile/eas-build-result.json
          retention-days: 30

      - name: Clean up Apple credentials
        if: always()
        working-directory: apps/mobile
        run: rm -rf secrets/

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [build-android, submit-android, build-ios]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          echo "Build and Deployment Status:"
          echo "- Android Build: ${{ needs.build-android.result }}"
          echo "- Android Submit: ${{ needs.submit-android.result }}"
          echo "- iOS Build: ${{ needs.build-ios.result }}"

          if [ "${{ needs.build-android.result }}" == "success" ] && [ "${{ needs.submit-android.result }}" == "success" ]; then
            echo "✅ Android deployed to Google Play Store successfully!"
          else
            echo "❌ Android deployment failed."
          fi

          if [ "${{ needs.build-ios.result }}" == "success" ]; then
            echo "✅ iOS build completed successfully!"
          else
            echo "❌ iOS build failed."
          fi
